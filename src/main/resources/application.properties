# 1. Configuracion de Base de Datos
spring.datasource.url=jdbc:postgresql://localhost:5432/cafeteria_db
spring.datasource.username=postgres
spring.datasource.password=123456

# 2. Configuracion de Hibernate y JPA
# Cambiamos 'true' por 'false' para produccion segun recomendacion
spring.jpa.show-sql=false
# Esto permite ver los parametros de las consultas solo si realmente lo necesitas en consola
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# 3. Gestion de la Estructura (Update es ideal para desarrollo/pruebas)
spring.jpa.hibernate.ddl-auto=update

# 4. Configuracion de Archivos (Para tus fotos de productos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 5. Ajustes de Serializacion y Vistas
spring.jackson.serialization.fail-on-empty-beans=false
# Mantenerlo en true ayuda a evitar el error de sesion cerrada en el frontend
spring.jpa.open-in-view=true