services:
  db:
    image: postgres:15
    container_name: cafeteria-db
    restart: always
    environment:
      POSTGRES_USER: user_cafeteria
      POSTGRES_PASSWORD: password_cafeteria
      POSTGRES_DB: cafeteria_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: