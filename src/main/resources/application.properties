# Conexión a la base de datos de Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/cafeteria_db
spring.datasource.username=user_cafeteria
spring.datasource.password=password_cafeteria

# Configuración de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Debug para ver la carga de imágenes (binarios) en la consola
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE